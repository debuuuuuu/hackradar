name: daily

on:
  schedule:
    - cron: "17 23 * * *" # 23:17 UTC = 04:47 IST; with GitHub's delay lands ~5 AM IST (D-018)
  workflow_dispatch:

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write # keepalive push to the status branch (D-023)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tags; pin exact

      - run: uv sync --frozen --no-dev

      - name: Run pipeline
        run: uv run python -m pipeline.run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}

      # Supabase pauses free projects after about a week without database activity (D-046).
      # One real query a day through its REST API stops that. Skipped until the secrets exist; never fails the run.
      - name: Supabase keep-alive query
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "Supabase secrets not set; skipping"
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL%/}/rest/v1/keepalive?select=id&limit=1" || true)
          echo "Supabase keep-alive HTTP ${code}"
          [ "${code}" = "200" ] || echo "::warning::Supabase keep-alive did not return 200 (got ${code})"

      # Runs even if the pipeline failed, so the schedule stays alive.
      - name: Keepalive commit to status branch
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f data/last_run.json ]; then
            mkdir -p data
            echo "{\"status\": \"no-output\", \"finished_at_utc\": \"$(date -u +%FT%TZ)\"}" > data/last_run.json
          fi
          mv data/last_run.json "$RUNNER_TEMP/last_run.json"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin status >/dev/null; then
            git fetch --depth=1 origin status
            git checkout -f -B status FETCH_HEAD
          else
            git checkout --orphan status
            git rm -rf --cached --quiet .
          fi

          mkdir -p data
          cp "$RUNNER_TEMP/last_run.json" data/last_run.json
          git add -f data/last_run.json
          git commit -m "chore: keepalive $(date -u +%FT%TZ)"
          git push origin status
