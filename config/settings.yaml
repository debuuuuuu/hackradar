# HackRadar settings. No secrets here — those come from env vars (.env.example).

timezone: Asia/Kolkata

ai:
  batch_provider: groq       # groq | gemini | claude  (D-006, D-035; gemini/claude adapters not built yet)
  ask_provider: groq         # (D-007)
  groq_model: openai/gpt-oss-120b  # llama-3.3-70b is not available on this account (research/2026-10-15-groq.md)
  max_output_tokens: 1500    # reasoning models spend part of this on thinking
  reasoning_effort: low
  max_retries: 3
  batch_size: 12             # events per summarize call (10–15)
  batch_pause_seconds: 30    # Groq counts reserved output too: ~3.2k tokens/call, limit 8,000/min
  max_events_per_run: 60     # daily cap on new/changed events enriched (5 batches ~ 75 s)

rank:
  shortlist: 12          # topic-matched events sent to the AI per topic group (D-051)
  max_seconds: 480       # stop starting topic groups after this long; the rest wait for the next run
  max_groups: 40         # most AI calls per run (largest groups first)

digest:
  top_n: 5
  list_limit: 10            # Phase 1: max items per digest section
  closing_soon_days: 3
  ai_picks: 3
  # Owner's preferences until the users/preferences tables are wired in (Phase 3).
  home_city: pune
  radius_km: 150            # in-person events farther than this are hidden; online always shown
  show_contests: false      # hide the "Contests & other" section

reminders:
  default_offsets: [7, 3, 1, 0]   # 0 = same-day morning alert (D-019)

http:
  user_agent: "HackRadarBot/0.1 (+https://github.com/debuuuuuu/hackradar)"
  min_interval_seconds: 1.0       # per host
  max_retries: 3
