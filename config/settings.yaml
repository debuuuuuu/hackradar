# HackRadar settings. No secrets here — those come from env vars (.env.example).

timezone: Asia/Kolkata

ai:
  batch_provider: gemini     # gemini | groq | claude  (D-006)
  ask_provider: groq         # (D-007)
  batch_size: 12             # events per summarize call (10–15)

digest:
  top_n: 5
  list_limit: 10            # Phase 1: max items per digest section
  closing_soon_days: 3
  ai_picks: 3

reminders:
  default_offsets: [7, 3, 1, 0]   # 0 = same-day morning alert (D-019)

http:
  user_agent: "HackRadarBot/0.1 (+https://github.com/debuuuuuu/hackradar)"
  min_interval_seconds: 1.0       # per host
  max_retries: 3
